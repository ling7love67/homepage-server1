<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 响应式关键：手机375px适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目列表页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{padding:16px;font-family:system-ui;}
        header{background:#222;color:#fff;padding:12px 16px;border-radius:8px;margin-bottom:16px;}
        main{max-width:800px;margin:0 auto;}
        section{background:#f5f5f5;padding:16px;border-radius:8px;margin-bottom:16px;}
        input{padding:8px;width:70%;margin-right:8px;}
        button{padding:8px 14px;cursor:pointer;}
        .item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ccc;}
        footer{margin-top:30px;text-align:center;color:#666;}
        @media(max-width:375px){
            input{width:60%;}
        }
    </style>
</head>
<body>
    <header>
        <h1>我的项目列表</h1>
        <nav>
            <a href=" ">前往个人主页</a >
        </nav>
    </header>
    <main>
        <section>
            <h3>添加新项目</h3>
            <input id="titleInput" placeholder="输入项目名称">
            <button onclick="addItem()">新增</button>
        </section>
        <section>
            <h3>项目列表</h3>
            <div id="listBox"></div>
        </section>
    </main>
    <footer>前端作业 · 前后端联调</footer>

    <script>
        // 渲染列表
        async function renderList(){
            const res = await fetch("http://127.0.0.1:3000/api/list");
            const json = await res.json();
            const box = document.getElementById("listBox");
            box.innerHTML = "";
            json.data.forEach(item=>{
                box.innerHTML += `
                <div class="item">
                    <span>${item.name}</span>
                    <button onclick="delItem(${item.id})">删除</button>
                </div>`
            })
        }
        // 新增
        async function addItem(){
            const val = document.getElementById("titleInput").value.trim();
            if(!val) return alert("内容不能为空");
            await fetch("http://127.0.0.1:3000/api/add",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({name:val})
            })
            document.getElementById("titleInput").value="";
            renderList();
        }
        // 删除
        async function delItem(id){
            await fetch(`http://127.0.0.1:3000/api/del?id=${id}`,{method:"DELETE"})
            renderList();
        }
        // 页面加载自动拉取数据
        renderList();
    </script>
</body>
</html>
